---
"name": "CI YAML"

"on":
  "pull_request":
    "paths":
      - "**/*.yaml"
      - "**/*.yml"
      - ".editorconfig"
      - ".oxfmtrc.json"
  "push":
    "branches":
      - "main"
    "paths":
      - "**/*.yaml"
      - "**/*.yml"
      - ".editorconfig"
      - ".oxfmtrc.json"

"permissions":
  "contents": "read"

"concurrency":
  "group": "${{ github.workflow }}-${{ github.ref }}"
  "cancel-in-progress": true

"jobs":
  "verify":
    "runs-on": "ubuntu-latest"
    "timeout-minutes": 10
    "steps":
      - "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        "with":
          "persist-credentials": false

      - "uses": "pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024" # v3.0.0
        "with":
          "version": "12"
          "install": false

      - "name": "Format Check YAML"
        "run": "git ls-files -z -- '*.yaml' '*.yml' | xargs -0 -r pnx oxfmt --check --"

      - "name": "Lint YAML"
        "run": "git ls-files -z -- '*.yaml' '*.yml' | xargs -0 -r yamllint --strict --format github --"
...
