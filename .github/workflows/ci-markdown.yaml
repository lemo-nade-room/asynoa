---
"name": "CI Markdown"

"on":
  "pull_request":
    "paths":
      - "**/*.md"
      - "**/*.markdown"
      - ".editorconfig"
      - ".oxfmtrc.json"
      - ".rumdl.toml"
      - ".github/workflows/ci-markdown.yaml"
  "push":
    "branches":
      - "main"
    "paths":
      - "**/*.md"
      - "**/*.markdown"
      - ".editorconfig"
      - ".oxfmtrc.json"
      - ".rumdl.toml"
      - ".github/workflows/ci-markdown.yaml"

"permissions":
  "contents": "read"

"concurrency":
  "group": "${{ github.workflow }}-${{ github.ref }}"
  "cancel-in-progress": true

"jobs":
  "verify":
    "runs-on": "ubuntu-latest"
    "timeout-minutes": 10
    "steps":
      - "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        "with":
          "persist-credentials": false

      - "uses": "pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4" # v3.1.1
        "with":
          "version": "12"
          "install": false

      - "uses": "rvben/rumdl@41e15c580461c971819816143d4e43c636647674" # v0.2.75
        "with":
          "install-only": true

      - "name": "Format Check Markdown"
        "run": "git ls-files -z -- '*.md' '*.markdown' | xargs -0 -r pnx oxfmt --check --"

      - "name": "Lint Markdown"
        "run": "git ls-files -z -- '*.md' '*.markdown' | xargs -0 -r rumdl check --output-format github --"
...
